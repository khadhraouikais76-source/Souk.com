<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>🛒 سوق البيع و الشراء</title>

<style>
body{margin:0;font-family:Arial;background:#f2f2f2;direction:rtl}
header{background:#0a7cff;color:white;padding:10px}
nav{display:flex;justify-content:space-between;align-items:center}
nav button{background:white;color:#0a7cff;border:none;padding:6px 10px;border-radius:6px}
.container{max-width:900px;margin:auto;padding:10px}
.tabs button{margin:3px;padding:6px 10px;border:none;border-radius:6px}
.card{background:white;padding:10px;border-radius:8px;margin-bottom:10px}
.card img{width:100%;border-radius:6px}
input,select,textarea,button{width:100%;padding:8px;margin-top:5px}
.hidden{display:none}
.error{color:red}
</style>
</head>

<body>

<header>
<nav>
  <h3>🛒 سوق البيع و الشراء</h3>
  <div>
    <button onclick="showMarket()">تصفح</button>
    <button onclick="showSeller()">بيع / تسجيل</button>
  </div>
</nav>
</header>

<div class="container">

<!-- MARKET -->
<div id="market">
  <div class="tabs">
    <button onclick="filterCat('all')">الكل</button>
    <button onclick="filterCat('phones')">📱 هواتف</button>
    <button onclick="filterCat('cars')">🚗 سيارات</button>
    <button onclick="filterCat('homes')">🏠 عقارات</button>
    <button onclick="filterCat('other')">📦 أخرى</button>
  </div>
  <div id="products"></div>
</div>

<!-- LOGIN -->
<div id="login" class="hidden card">
  <h3>تسجيل / دخول</h3>
  <input id="lu" placeholder="اسم المستخدم">
  <input id="lp" type="password" placeholder="كلمة السر">
  <button onclick="login()">دخول / تسجيل</button>
  <div class="error" id="lerr"></div>
</div>

<!-- SELL -->
<div id="sell" class="hidden card">
  <h3>نشر إعلان</h3>
  <input id="title" placeholder="اسم السلعة">
  <input id="price" placeholder="السعر">
  <select id="cat">
    <option value="phones">📱 هواتف</option>
    <option value="cars">🚗 سيارات</option>
    <option value="homes">🏠 عقارات</option>
    <option value="other">📦 أخرى</option>
  </select>
  <textarea id="desc" placeholder="وصف المنتج"></textarea>
  <input id="city" placeholder="الولاية / العنوان">
  <input id="phone" placeholder="رقم الهاتف">
  <input type="file" id="img">
  <button onclick="publish()">نشر</button>
  <button onclick="logout()">تسجيل خروج</button>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const app = initializeApp({
  apiKey: "AIzaSyA_5OCpY0HUAAzYmKIhW7uaLrCoe4GSHm0",
  databaseURL: "https://souk-92715-default-rtdb.firebaseio.com",
  projectId: "souk-92715",
  storageBucket: "souk-92715.firebasestorage.app",
});
const db = getDatabase(app);
const storage = getStorage(app);

let user = localStorage.getItem("user");
let currentCat = "all";

function hash(p){return btoa(p);}

window.showMarket=()=>{market.classList.remove("hidden");login.classList.add("hidden");sell.classList.add("hidden");}
window.showSeller=()=>{
  market.classList.add("hidden");
  user ? sell.classList.remove("hidden") : login.classList.remove("hidden");
};

window.login=async()=>{
  lerr.innerText="";
  const u=lu.value.toLowerCase(), p=lp.value;
  const r=ref(db,"users/"+u), s=await get(r);
  if(!s.exists()){await set(r,{p:hash(p)});localStorage.setItem("user",u);}
  else if(s.val().p!==hash(p)){lerr.innerText="❌ الاسم مستعمل و كلمة السر غالطة";return;}
  localStorage.setItem("user",u);location.reload();
};

window.logout=()=>{localStorage.removeItem("user");location.reload();};

window.publish=async()=>{
  if(!img.files[0]) return alert("أضف صورة");
  const ir=sRef(storage,"img/"+Date.now());
  await uploadBytes(ir,img.files[0]);
  const url=await getDownloadURL(ir);

  await push(ref(db,"products"),{
    title:title.value,price:price.value,cat:cat.value,
    desc:desc.value,city:city.value,phone:phone.value,
    img:url,user:user,time:Date.now()
  });
  alert("تم النشر ✔️");
};

function load(){
  onValue(ref(db,"products"),s=>{
    products.innerHTML="";
    s.forEach(i=>{
      const p=i.val();
      if(currentCat!=="all" && p.cat!==currentCat) return;
      products.innerHTML+=`
      <div class="card">
        <img src="${p.img}">
        <b>${p.title}</b> – 💰 ${p.price}<br>
        ${p.desc}<br>
        📍 ${p.city}<br>
        📞 ${p.phone}
      </div>`;
    });
  });
}
window.filterCat=c=>{currentCat=c;load();}
load();
</script>

</body>
</html>
